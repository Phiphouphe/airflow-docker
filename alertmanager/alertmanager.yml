global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'pserour@gmail.com'
  smtp_auth_username: 'pserour@gmail.com'
  smtp_auth_password: '${GMAIL_APP_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      - to: 'philistineserour@neuf.fr'
        send_resolved: true
