global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'xxxx@gmail.com'
  smtp_auth_username: 'xxxx@gmail.com'
  smtp_auth_password: '${GMAIL_APP_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'email-webhook'

receivers:
  - name: 'email-webhook'
    email_configs:
      - to: 'dddd@gmail.com'
        send_resolved: true
    webhook_configs:
      - url: 'http://webhook:9099/webhook'
        send_resolved: true
